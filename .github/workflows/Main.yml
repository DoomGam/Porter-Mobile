name: Build Porter-Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelibs Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.2.1
          haxelib install flixel 4.11.0
          haxelib install flixel-ui
          haxelib install hscript
          haxelib git extension-androidtools https://github.com/LimeExtensions/extension-androidtools.git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Configure Lime Android SDK/NDK
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64

      - name: Test Python Core Scripts
        run: |
          python3 core/python/shader_fixer.py .
          python3 core/python/source_injector.py Project.xml

      - name: Compile Android APK
        run: haxelib run lime build android -final -D officialBuild

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Porter-Mobile-Release-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
